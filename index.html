<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocketd — Legal &amp; Support</title>
<meta name="description" content="Privacy policy, terms of service and support for the Pocketd budgeting app.">
<style>
  :root { color-scheme: light; --teal:#00BFA6; --teal-dk:#00897B; --bg:#F6F7F9; --surface:#FFFFFF; --line:#E4E7EC; --text:#1A1B25; --muted:#5B6273; }
  @media (prefers-color-scheme: dark){ :root{ color-scheme:dark; --bg:#0B0C12; --surface:#14161F; --line:#262A38; --text:#ECEEF4; --muted:#9AA0B2; --teal-dk:#2BD4BD; } }
  *{box-sizing:border-box;} html,body{margin:0;}
  body{ background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.6; padding:env(safe-area-inset-top,0) 20px 64px; }
  .wrap{ max-width:560px; margin:0 auto; }
  header{ display:flex; align-items:center; gap:16px; padding:56px 0 28px; }
  .mark{ width:60px; height:60px; border-radius:28%; box-shadow:0 2px 8px rgba(16,18,30,.18); flex:none; }
  h1{ font-size:28px; font-weight:800; letter-spacing:-.02em; margin:0; }
  .sub{ color:var(--muted); margin:2px 0 0; }
  ul{ list-style:none; margin:20px 0 0; padding:0; }
  li{ margin:0 0 12px; }
  a.card{ display:flex; align-items:center; justify-content:space-between; gap:12px; text-decoration:none; color:var(--text);
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; font-weight:600; }
  a.card:hover{ border-color:var(--teal); }
  a.card .arrow{ color:var(--teal-dk); font-weight:700; }
  footer{ color:var(--muted); font-size:14px; margin-top:40px; }
  footer a{ color:var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <svg class="mark" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00D6BC"/><stop offset="1" stop-color="#009E8A"/></linearGradient></defs>
        <rect width="1024" height="1024" rx="230" fill="url(#g)"/>
        <g transform="translate(512 512) scale(1.16) translate(-512 -532)">
          <circle cx="512" cy="428" r="118" fill="#64FFDA"/>
          <rect x="286" y="454" width="452" height="300" rx="54" fill="#FFFFFF"/>
          <path d="M286 520 H738" stroke="#00A98F" stroke-width="26" stroke-linecap="round" opacity=".16"/>
        </g>
      </svg>
      <div>
        <h1>Pocketd</h1>
        <p class="sub">Legal &amp; Support</p>
      </div>
    </header>
    <ul>
      <li><a class="card" href="privacy/">Privacy Policy <span class="arrow">&rarr;</span></a></li>
      <li><a class="card" href="terms/">Terms of Service <span class="arrow">&rarr;</span></a></li>
      <li><a class="card" href="support/">Support <span class="arrow">&rarr;</span></a></li>
    </ul>
    <footer><p>Pocketd is a local-first budgeting app. <a href="https://nelsonthegr8.github.io/pocketd/">See what it does</a>. Questions? <a href="https://github.com/nelsonthegr8/pocketed-legal/issues">Open an issue on GitHub</a> (issues are public, so please leave out any financial details).</p></footer>
  </div>
</body>
</html>
